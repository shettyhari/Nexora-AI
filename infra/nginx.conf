worker_processes auto;

events {
    worker_connections 2048;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65s;
    server_tokens off;

    # Allow multimodal uploads up to 50MB
    client_max_body_size 50m;

    # Rate limit zones (defense-in-depth alongside FastAPI Redis/in-memory rate limiter)
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=120r/m;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=30r/m;

    upstream nexora_frontend {
        server frontend:3000;
        keepalive 32;
    }

    upstream nexora_backend {
        server backend:8000;
        keepalive 64;
    }

    upstream nexora_inference {
        server worker-inference:8001;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        # Global Security Headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;

        # Dedicated health endpoint for container orchestrators / load balancers
        location /nginx-health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # Authentication endpoints with stricter per-IP throttling
        location /api/v1/auth/ {
            limit_req zone=auth_limit burst=15 nodelay;
            proxy_pass http://nexora_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # SSE Streaming AI Responses & Agentic Chat (zero proxy buffering)
        location /api/v1/messages {
            limit_req zone=api_limit burst=40 nodelay;
            proxy_pass http://nexora_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding on;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # Commercial OpenAI-Compatible API (/v1/*) routed via API backend auth/billing gate
        location /v1/ {
            limit_req zone=api_limit burst=60 nodelay;
            proxy_pass http://nexora_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 300s;
        }

        # Backend REST API, Health & Metrics
        location ~ ^/(api|health|metrics)(/|$) {
            limit_req zone=api_limit burst=60 nodelay;
            proxy_pass http://nexora_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_read_timeout 180s;
        }

        # Dedicated internal OpenAI-serving health endpoint
        location /inference-health {
            proxy_pass http://nexora_inference/v1/health;
            proxy_http_version 1.1;
        }

        # Next.js Commercial Frontend
        location / {
            proxy_pass http://nexora_frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
