name: NEXORA AI Production CI/CD Pipeline

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main]

jobs:
  backend-verify:
    name: Backend Migrations, Security Audit & E2E Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Alembic database migrations on fresh SQLite DB
        env:
          DATABASE_URL: sqlite+aiosqlite:///./ci_migration_check.db
          SECRET_KEY: ci_test_secret_key_nexora_32_characters_minimum_length
        run: |
          alembic upgrade head
          rm -f ci_migration_check.db

      - name: Run full backend test suite (Core + Model Lab + Security Audit + E2E)
        env:
          SECRET_KEY: ci_test_secret_key_nexora_32_characters_minimum_length
        run: |
          pytest -v --tb=short

  frontend-verify:
    name: Frontend Typecheck, Lint & Production Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run Next.js production build
        env:
          NEXT_PUBLIC_API_URL: https://api.nexora.example.com
        run: npm run build

  infra-validate:
    name: Validate Docker Compose & Nginx Topology
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate development Docker Compose schema
        run: docker compose -f docker-compose.yml config -q

      - name: Validate production Docker Compose schema
        env:
          POSTGRES_PASSWORD: ci_validation_dummy_password
        run: docker compose -f docker-compose.prod.yml config -q

      - name: Validate Nginx reverse-proxy configuration syntax
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/infra/nginx.conf:/etc/nginx/nginx.conf:ro" \
            nginx:1.27-alpine nginx -t || true
